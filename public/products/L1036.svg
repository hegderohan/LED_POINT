      <g transform="rotate(270)"><path d="M0 0 q72 -12 90 -56 q-48 6 -90 40 Z" fill="hsla(198, 88%, 58%, 1)" fill-opacity="0.18"/></g>
      <circle cx="0" cy="0" r="17"/>
